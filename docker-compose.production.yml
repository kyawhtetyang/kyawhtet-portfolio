services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    command: npm run preview -- --host 0.0.0.0 --port 4173
    environment:
      - NODE_ENV=production

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
